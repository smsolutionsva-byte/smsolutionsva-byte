<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">Shivansh Mukhia - Full-Stack Developer and AI Systems Builder</title>
  <desc id="desc">A dark, technical profile banner with Shivansh's name, specialties, and builder philosophy.</desc>
  <defs>
