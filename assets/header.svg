      <stop offset="0" stop-color="#06111f"/>
      <stop offset="0.52" stop-color="#0b1830"/>
      <stop offset="1" stop-color="#111633"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
