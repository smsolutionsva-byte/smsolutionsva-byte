        <text x="66" y="118" fill="#67e8f9">focus</text>
        <text x="110" y="118" fill="#8fa2bc">:</text>
        <text x="123" y="118" fill="#f8fafc">[</text>
        <text x="135" y="118" fill="#86efac">"AI"</text>
        <text x="165" y="118" fill="#8fa2bc">,</text>
        <text x="177" y="118" fill="#86efac">"data"</text>
        <text x="225" y="118" fill="#8fa2bc">,</text>
        <text x="237" y="118" fill="#86efac">"impact"</text>
        <text x="306" y="118" fill="#f8fafc">],</text>

        <text x="22" y="145" fill="#7185a3">04</text>
        <text x="66" y="145" fill="#67e8f9">method</text>
        <text x="118" y="145" fill="#8fa2bc">:</text>
        <text x="132" y="145" fill="#f8fafc">[</text>
        <text x="144" y="145" fill="#fb7185">"learn"</text>
        <text x="196" y="145" fill="#8fa2bc">,</text>
        <text x="208" y="145" fill="#fb7185">"build"</text>
        <text x="260" y="145" fill="#8fa2bc">,</text>
        <text x="272" y="145" fill="#fb7185">"ship"</text>
        <text x="316" y="145" fill="#f8fafc">],</text>

        <text x="22" y="172" fill="#7185a3">05</text>
        <text x="66" y="172" fill="#67e8f9">quality</text>
        <text x="126" y="172" fill="#8fa2bc">:</text>
        <text x="140" y="172" fill="#fde68a">"proof over hype"</text>
        <text x="280" y="172" fill="#8fa2bc">,</text>

